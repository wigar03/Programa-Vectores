name: Windows release checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-windows-lock.txt
      - name: Python tests
        run: python -m unittest discover tests -v
      - name: JavaScript tests
        shell: pwsh
        run: node --test (Get-ChildItem tests/test_*.cjs).FullName
      - name: Build executable and setup
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Test portable, install, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test_windows_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-windows-x64
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
